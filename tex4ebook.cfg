\Preamble{xhtml,fn-in}
\def\purpose{pdf}                          % il preambolo usa \purpose nelle condizionali (\dropcap, \spoken, ...)
\setboolean{illustrations}{false}          % disattiva la macchina originale (adjustbox/afterpage/center): rompe tex4ht 2026
\Configure{resettoclevels}{part,appendix,chapter}   % indice epub: solo fino al capitolo
\begin{document}
\Configure{crosslinks}{}{}{}{}{}{}{}{}
\ConfigureToc{section}{}{}{}{}             % sezioni/sottosezioni fuori dall'indice (restano titoli nel corpo)
\ConfigureToc{subsection}{}{}{}{}
\ConfigureToc{subsubsection}{}{}{}{}
% ---------- Capolettera per l'epub ----------
% Su tex4ht 2026 né \smartdropcap (Lua) né \lettrine producono le classi .lettrine; le generiamo a mano.
% .dropcap = lettera (Acorn), .dropcap-ante = « iniziale, .dropcap-rest = maiuscoletto.
\def\dropcapepubaux#1#2\relax{\HCode{<span class="dropcap"><span class="dropcap-ante">}\the\spokenAnteToks\HCode{</span>}#1\HCode{</span><span class="dropcap-rest">}#2\HCode{</span>}}
\RenewDocumentCommand{\smartdropcap}{m}{\dropcapepubaux#1\relax}
\RenewDocumentCommand{\dropcap}{mm}{\HCode{<span class="dropcap">}#1\HCode{</span><span class="dropcap-rest">}#2\HCode{</span>}}
% ---------- Illustrazioni per l'epub ----------
% Niente impaginazione (position/dimension non hanno senso a scorrimento): immagine inline nel punto del comando.
% Evitiamo setkeys/adjustbox/afterpage/center E xstring: tutti si rompono sotto tex4ht 2026 e
% mandano in cascata anche babel/soul. Estraiamo image= con una macro delimitata di puro TeX.
% \includegraphics fa sì che tex4ebook copi da solo il file nell'epub.
\def\illusextract#1image=#2,#3\relax{\def\illusimg{#2}}
\RenewDocumentCommand{\illustration}{O{}}{%
  \illusextract#1,image=,\relax
  \ifvmode\IgnorePar\fi\EndP\HCode{<div class="illus">}\includegraphics{\illusimg}\HCode{</div>}%
}
% ---------- Font incorporati (impacchettati da fonts.mk4, opzione -e nel Makefile) ----------
% Testo: EB Garamond (SIL OFL)
\Css{@font-face{font-family:"EB Garamond"; font-weight:normal; font-style:normal; src:url(fonts/EB_Garamond/static/EBGaramond-Regular.ttf);}}
\Css{@font-face{font-family:"EB Garamond"; font-weight:normal; font-style:italic; src:url(fonts/EB_Garamond/static/EBGaramond-Italic.ttf);}}
\Css{@font-face{font-family:"EB Garamond"; font-weight:bold;   font-style:normal; src:url(fonts/EB_Garamond/static/EBGaramond-Medium.ttf);}}
\Css{@font-face{font-family:"EB Garamond"; font-weight:bold;   font-style:italic; src:url(fonts/EB_Garamond/static/EBGaramond-MediumItalic.ttf);}}
% Capilettera: Acorn Initials
\Css{@font-face{font-family:"Acorn"; src:url(fonts/AcornInitials/AcornInitials.ttf);}}
% ---------- Stile default; il lettore può sovrascriverlo ----------
\Css{body{font-family:"EB Garamond", serif; text-align: justify; hyphens: auto; -webkit-hyphens: auto;}}
\Css{p{margin-top: 0; margin-bottom: 0;}}
\Css{p + p{margin-top: 0;}}
\Css{p.indent{text-indent: 1.2em;}}
\Css{p.noindent{text-indent: 0;}}
% Capolettera a 4 righe nel font Acorn (regola qui dimensione/colore)
\Css{.dropcap{font-family:"Acorn", serif; font-size: 6.8em; line-height: 0.8; float: left; margin: 0 0.08em -0.1em 0; color: gray; position: relative;}}
\Css{.dropcap-ante{font-family:"EB Garamond", serif; position: absolute; top: 0; left: -0.42em; font-size: 0.24em; color: gray;}}
\Css{.dropcap-rest{font-variant: small-caps;}}
% Illustrazioni centrate e scalate alla larghezza
\Css{.illus{text-align: center; margin: 1.2em 0;}}
\Css{.illus img{max-width: 100\%; height: auto;}}
\EndPreamble